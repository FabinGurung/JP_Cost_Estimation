name: Production Pages ownership guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "JP_Cost_Estimation GitHub Pages publication is owned by research/open-estimation-engine-v0.1."
          echo "The default main branch owns daily dispatch and historical recovery only; this guard is intentionally non-deploying."
