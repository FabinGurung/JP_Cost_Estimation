name: Historical manual research preview tests (retired auto-trigger)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Verify static estimator files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data.js
          node --check app.js
          node --check data.js
      - name: Test MEP trade navigation and rate integrity
        run: |
          for file in mep-catalog.js mep-app.js work-specifications.js work-construction-guide.js work-rate-units.js; do
            node --check "$file"
          done
          node scripts/qa_mep_site_v0.5.10.mjs

      - name: Source-family skeleton regression
        run: |
          node --check rate-source-skeleton.js
          node scripts/qa_rate_source_skeleton_v0.5.14.mjs

      - name: Source-derived view regression
        run: |
          node --check rate-source-skeleton.js
          node scripts/qa_source_derivations_v0.5.15.mjs

      - name: Finance snapshot regression
        run: |
          node --check finance.js
          node scripts/qa_kkg_finance_snapshot_v1.2.mjs

      - name: Validate shared presentation and reference wall
        run: |
          node --check site-navigation-v0.8.js
          node --check memory-posters.js
          node scripts/validate-site-theme-v0.8.mjs
          node scripts/validate-finance-public.mjs

      - name: FN-S01 native Finance header
        run: |
          node --check finance-register-header-v1.0.js
          node scripts/validate-finance-register-header-v1.0.mjs

      - name: Site page registry integrity
        run: |
          node scripts/validate-site-page-registry.mjs

      - name: Confirm non-production boundary
        run: |
          echo "VALIDATION_ONLY=PASS"
          echo "Research branch cannot deploy to the github-pages environment."
