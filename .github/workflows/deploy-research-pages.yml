name: Deploy research website to GitHub Pages

on:
  push:
    branches:
      - research/open-estimation-engine-v0.1
  workflow_dispatch:
    inputs:
      require_live_sheets:
        description: Fail if authenticated Sheets refresh cannot run
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4
      - name: Check JavaScript and site integrity
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js data.js site-navigation-v0.8.js finance.js finance-dashboard.js memory-posters.js; do
            node --check "$file"
          done
          node scripts/qa_mep_site_v0.5.10.mjs
          node scripts/qa_rate_source_skeleton_v0.5.14.mjs
          node scripts/qa_source_derivations_v0.5.15.mjs
          node scripts/qa_kkg_finance_snapshot_v1.2.mjs
          node scripts/validate-finance-public.mjs
          node scripts/validate-site-theme-v0.8.mjs
          node scripts/validate-site-page-registry.mjs
          node scripts/sync-amrit-rawat-rates.mjs --validate-current
          node scripts/validate-functional-domains.mjs
          node --check templates/project-costing/v1/work-directory.mjs
          node scripts/qa-methodology-site.mjs
          node --check templates/project-costing/v1/costing-pipeline.mjs
          node --check templates/project-costing/v1/project-view.mjs
          node scripts/qa-unified-costing.mjs
          node scripts/qa-home-navigation.mjs
          node scripts/qa-connected-sheets.mjs
          node --check memory-source-register.js
          node scripts/qa-estimation-memory-source-map.mjs
          node --check vendor-bills-status.js
          node scripts/qa-vendor-bills-status.mjs
          python3 scripts/build_vendor_bills_public.py --check
          node scripts/qa-all-site-routes.mjs
          node scripts/qa-cardinal-layout.mjs
          node scripts/qa-amrit-source-version.mjs
          node --check finance-source-panels-v0.9.js
          node scripts/validate-finance-panels-v0.9.mjs
          python3 scripts/build_finance_from_google_sheets.py --self-test
          python3 scripts/build_amrit_project_from_google_sheets.py --self-test
          python3 scripts/build_fabin_finance_from_google_sheets.py --self-test
          node --check finance-fabin-v1.js
          node scripts/qa-fabin-finance.mjs
          node --check finance-register-header-v1.0.js
          node scripts/validate-finance-register-header-v1.0.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: jp-site-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified publishing branch
        uses: actions/checkout@v4
      - name: Detect configured Google Sheets connection
        id: google_connection
        env:
          GOOGLE_PROVIDER: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER || 'projects/247425973072/locations/global/workloadIdentityPools/jp-pages-github/providers/github' }}
          GOOGLE_ACCOUNT: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT || 'jp-pages-publisher@just-a-project-5007.iam.gserviceaccount.com' }}
          GOOGLE_KEY: ${{ secrets.JP_GOOGLE_CREDENTIALS }}
          REQUIRE_LIVE: ${{ inputs.require_live_sheets || false }}
        run: |
          if [[ -n "$GOOGLE_PROVIDER" && -n "$GOOGLE_ACCOUNT" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'federation=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$GOOGLE_KEY" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'federation=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'federation=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Google connection unavailable: reviewed historic JSON remains in Pages, NOT a live refresh.'
            echo 'Finance Google Sheets: NOT CONNECTED; historical snapshot only.' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$REQUIRE_LIVE" == 'true' ]]; then exit 1; fi
          fi

      - name: Authenticate using keyless Google identity
        if: steps.google_connection.outputs.configured == 'true' && steps.google_connection.outputs.federation == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER || 'projects/247425973072/locations/global/workloadIdentityPools/jp-pages-github/providers/github' }}
          service_account: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT || 'jp-pages-publisher@just-a-project-5007.iam.gserviceaccount.com' }}

      - name: Authenticate using configured repository secret
        if: steps.google_connection.outputs.configured == 'true' && steps.google_connection.outputs.federation != 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.JP_GOOGLE_CREDENTIALS }}

      - name: Refresh public finance data directly from the LIVE Sheet
        if: steps.google_connection.outputs.configured == 'true'
        run: |
          python3 -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
          python3 scripts/build_finance_from_google_sheets.py
          node scripts/validate-finance-public.mjs
          echo 'Finance Google Sheets: AUTHENTICATED LIVE FETCH; totals validated.' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage static Pages files excluding Google credentials
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='gha-creds-*.json' --exclude='*.pem' --exclude='*.key' \
            --exclude='.env*' --exclude='*.qmd' --exclude='*.ipynb' \
            --exclude='private-source' --exclude='draft-notes' \
            --exclude='__pycache__' --exclude='node_modules' \
            --exclude='scripts' ./ _site/
      - name: Read authenticated Amrit project measurements and rate selections
        if: steps.google_connection.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python3 scripts/build_amrit_project_from_google_sheets.py --output _site/projects/rohini/ward-14/amrit-rawat/project-costing.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('_site/projects/rohini/ward-14/amrit-rawat/project-costing.json').read_text())
          assert p['publicSnapshot']['authenticatedSourceFetch'] is True
          assert p['publicSnapshot']['admittedMeasurementRows']==len(p['measurementRows'])
          assert p['publicSnapshot']['admittedRateSelections']==len(p['rateSelections'])
          assert p['boqRows']==[] and p['aoc']['grandTotalNpr'] is None
          print("PASS staged Amrit public projection: source-backed rows only; unapproved BOQ/actual bills excluded")
          PY
          echo 'Amrit source: AUTHENTICATED LIVE SHEET READ; only verified QTO and approved rate inputs admitted; BOQ remains draft pending approval.' >> "$GITHUB_STEP_SUMMARY"

      - name: Read Fabin v0.7 normalized Google Sheet into public-safe provisional project totals
        if: steps.google_connection.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_fabin_finance_from_google_sheets.py --output _site/fabin-payments-public.json
          node scripts/qa-fabin-finance.mjs --staged _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('_site/fabin-payments-public.json').read_text())
          print('FABIN SOURCE VERSION:', p['sourceVersion'], 'normalized event revision:', p['normalizedEventVersion'])
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('Fabin source: AUTHENTICATED READ; control revision '
                        + p['sourceVersion'] + ', unchanged event revision '
                        + p['normalizedEventVersion']
                        + '; five source-reported aggregates only, NOT certified payments; '
                        + 'Basketball excluded and Hari reconciliation debt visible.\\n')
          PY

      - name: Refresh Vendor Bills counts on a manual run
        if: github.event_name == 'workflow_dispatch' && steps.google_connection.outputs.configured == 'true'
        env:
          JP_VENDOR_BILLS_SHEET_ID: ${{ secrets.JP_VENDOR_BILLS_SHEET_ID }}
          REQUIRE_LIVE: ${{ inputs.require_live_sheets || false }}
        run: |
          if [[ -n "$JP_VENDOR_BILLS_SHEET_ID" ]]; then
            python3 scripts/build_vendor_bills_public.py --output _site/data/vendor-bills-status.v1.json
            echo 'Vendor Bills: authenticated aggregate refresh.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Vendor Bills: verified snapshot used. The optional source secret is unset.' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$REQUIRE_LIVE" == 'true' ]]; then
              echo '::error::Missing JP_VENDOR_BILLS_SHEET_ID: authenticated Vendor Bills refresh was required.'
              exit 1
            fi
          fi

      - name: Validate staged Pages against notebook privacy and public route boundaries
        run: node scripts/qa-methodology-site.mjs --staged _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v4

