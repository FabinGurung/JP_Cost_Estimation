name: Amrit Rawat · Daily Google Sheet rate sync
# GitHub schedules only work from the repository default branch (main).
# This calls the reusable research-branch workflow, which checks out research,
# reads the private Sheet using secrets, and commits validated public JSON to research.
# No private Sheet ID, Google Drive URL or service-account key is stored in code.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *' # 06:02 Nepal Standard Time

permissions:
  contents: write

concurrency:
  group: amrit-rawat-default-scheduler
  cancel-in-progress: false

jobs:
  update-governed-snapshot:
    uses: FabinGurung/JP_Cost_Estimation/.github/workflows/sync-amrit-rawat-rates.yml@research/open-estimation-engine-v0.1
    permissions:
      contents: write
    secrets: inherit
