name: Amrit Rawat — Manual Google Sheet rate sync
# Explicit Run workflow only. No scheduled or push-triggered source updates.
# Reusable research workflow owns read-only source derivation; no second Pages deployment.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: amrit-rawat-default-scheduler
  cancel-in-progress: false

jobs:
  refresh-project-rate-assumptions:
    uses: FabinGurung/jp-estimating-and-boq/.github/workflows/sync-amrit-rawat-rates.yml@research/open-estimation-engine-v0.1
    permissions:
      contents: write
      id-token: write
    secrets: inherit
