name: Rohini / Amrit Rawat · Project cost assumptions sync
# GitHub scheduled workflows live on default main; the reusable research
# workflow owns the source-to-public-data derivation. No separate Pages deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *' # 06:02 Nepal local time
  push:
    branches:
      - main
    paths:
      - '.github/workflows/amrit-rawat-daily-sheet-sync.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: amrit-rawat-default-scheduler
  cancel-in-progress: false

jobs:
  refresh-project-rate-assumptions:
    uses: FabinGurung/jp-estimating-and-boq/.github/workflows/sync-amrit-rawat-rates.yml@research/open-estimation-engine-v0.1
    permissions:
      contents: write
      id-token: write
    secrets: inherit
