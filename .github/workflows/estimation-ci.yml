name: Estimation CI

on:
  push:
    branches:
      - "research/**"
      - "feature/site-theme-*"
  pull_request:
    branches:
      - main
      - "research/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify baseline files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data.js
          test -f README.md

      - name: JavaScript syntax check
        run: |
          node --check app.js
          node --check data.js

      - name: MEP and Work Specifications regression
        run: |
          for file in mep-catalog.js mep-app.js work-specifications.js work-construction-guide.js work-rate-units.js work-rate-library.js work-rate-comparison.js; do
            node --check "$file"
          done
          node --check scripts/qa_mep_site_v0.5.10.mjs
          node scripts/qa_mep_site_v0.5.10.mjs

      - name: Source-skeleton integrity and privacy regression
        run: |
          node --check rate-source-skeleton.js
          node scripts/qa_rate_source_skeleton_v0.5.14.mjs

      - name: Source-derived view regression
        run: |
          node --check rate-source-skeleton.js
          node scripts/qa_source_derivations_v0.5.15.mjs

      - name: Finance snapshot and dynamic-vendor regression
        run: |
          node --check finance.js
          node scripts/qa_kkg_finance_snapshot_v1.2.mjs

      - name: Finance public dashboard validation
        run: |
          node --check finance-dashboard.js
          node --check finance.js
          node --check scripts/validate-finance-public.mjs
          node scripts/validate-finance-public.mjs

      - name: Shared theme, reference wall and route integrity
        run: |
          node --check site-navigation-v0.8.js
          node --check memory-posters.js
          node --check scripts/validate-site-theme-v0.8.mjs
          node scripts/validate-site-theme-v0.8.mjs

      - name: Finance source panels and protected previews
        run: |
          node --check finance-source-panels-v0.9.js
          node scripts/validate-finance-panels-v0.9.mjs

      - name: FN-S01 native Finance header and public source views
        run: |
          node --check finance-register-header-v1.0.js
          node scripts/validate-finance-register-header-v1.0.mjs

      - name: Site page registry integrity
        run: |
          node --check scripts/validate-site-page-registry.mjs
          node scripts/validate-site-page-registry.mjs
          node scripts/sync-amrit-rawat-rates.mjs --validate-current

      - name: Public-site secret pattern check
        shell: bash
        run: |
          if grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_-]{20,}|password[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,})'             --exclude-dir=.git .; then
            echo "Potential secret-like material found in public repository."
            exit 1
          fi
