<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JP Estimation Workbench — Research v0.1</title>
  <meta name="description" content="Traceable Nepal-focused construction estimation workbench.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">JP</div>
      <div><strong>Estimation</strong><small>Open Engine v0.1</small></div>
    </div>
    <div class="preview-badge">RESEARCH BRANCH</div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="takeoff">Quantity Takeoff</button>
      <button class="nav-item" data-view="boq">BOQ / Cost Plan</button>
      <button class="nav-item" data-view="analysis">Rate Analysis</button>
      <button class="nav-item" data-view="rates">Rate Library</button>
      <button class="nav-item" data-view="sources">Source Registry</button>
      <button class="nav-item" data-view="provenance">Provenance</button>
      <a class="nav-item subpage-link" href="known-rates.html">Known Rates ↗</a>
    </nav>
    <div class="side-foot">
      <span>Baseline</span>
      <code>main@98b09c4</code>
    </div>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">JP CONSTRUCTION ESTIMATION SYSTEM</p>
        <h1 id="viewTitle">Estimate Dashboard</h1>
      </div>
      <div class="top-actions">
        <span class="status warn">DEMO / RESEARCH DATA</span>
        <button id="exportBtn" class="btn">Export JSON</button>
      </div>
    </header>

    <section class="control-strip">
      <label>Project
        <input id="projectName" value="Kumari Gurung Residence">
      </label>
      <label>Built-up area
        <div class="unit-input"><input id="builtSqft" type="number" min="100" step="1" value="1295.21"><span>sq.ft</span></div>
      </label>
      <label>Floors
        <input id="floors" type="number" min="1" max="8" value="2">
      </label>
      <button id="recalculate" class="btn primary">Recalculate</button>
    </section>

    <section id="view"></section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
